<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Sclera outline -->
  <path d="M4 32 C 16 16, 48 16, 60 32 C 48 48, 16 48, 4 32 Z" stroke="#38bdf8" stroke-width="2.5" fill="#071326" filter="url(#glow)"/>
  <!-- Iris -->
  <circle cx="32" cy="32" r="14" fill="url(#irisGrad)"/>
  <!-- Pupil -->
  <circle cx="32" cy="32" r="6.5" fill="#020617"/>
  <!-- Corneal highlight reflection -->
  <circle cx="28" cy="27" r="2.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="35" cy="35" r="1.2" fill="#ffffff" opacity="0.5"/>
</svg>
